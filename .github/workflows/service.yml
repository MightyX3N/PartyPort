name: Deploy party service

on:
  push:
    branches: [main]
    paths:
      - "service/**"
      - ".github/workflows/service.yml"
  workflow_dispatch:

concurrency:
  group: service-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          # The repo secret is named CLOUDFLARE_API_TOKE (GitHub can't rename secrets).
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKE }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: service
          packageManager: npm
      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Deployed to $URL"
          # A new workers.dev address can take a little while to answer.
          for i in $(seq 1 20); do
            if curl -fsS "$URL/" | grep -q '"partyport"'; then break; fi
            echo "not answering yet, retrying ($i)"; sleep 15
          done
          curl -fsS "$URL/" | grep -q '"partyport"'
          curl -fsS "$URL/service-key" | grep -q '"Ed25519"'
